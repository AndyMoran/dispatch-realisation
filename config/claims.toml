# Thresholds for the audit, mirrored from PREREGISTRATION.md (locked, v1.0-lock).
#
# PREREGISTRATION.md is the source; this file is a copy the code can read.
# Each entry gives:
#   value    the number the code uses
#   section  where the locked text defines it
#   text     the figure exactly as the locked text prints it ("5%", "1,000", "three")
#   quote    a phrase from that section containing the figure and saying what it means
# src/model/params.py refuses an entry whose value does not equal its text.
# tests/test_claims_params.py checks every quote against the locked text.
# Change an entry only with a new lock (PREREGISTRATION §8, §12).
