# Hard limits fail the build (PIPELINE_RULES §12).
# Runs the tests on every push and pull request. No network data is pulled in CI.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest -q
