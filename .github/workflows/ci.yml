# Hard limits fail the build (PIPELINE_RULES §12).
# Runs the tests on every push and pull request. No network data is pulled in CI.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check formatting (CODING.md §8)
        run: uv run ruff format --check .
      - name: Lint (CODING.md §8)
        run: uv run ruff check .
      - name: Type check (CODING.md §8)
        run: uv run mypy
      - name: Run tests, with coverage of new packages (CODING.md §7)
        run: uv run pytest -q --cov --cov-report=term

  # Known-answer bands for Claims 1–2 (PREREGISTRATION §8). The first run (18 Nov
  # 2026) failed its 4-week bands; that result stands and is reproduced here, not
  # re-judged. Deviation 2 (§12) gates scoring by length once every battery exists.
  known-answer:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Rerun the first Claims 1–2 band run, under its add-back rule (§8; §12, deviation 5)
        run: uv run python -m src.synthetic.bands --addback all --report-only --output rerun.json
      - name: Check the committed first run reproduces
        run: >-
          uv run python -c "import json, sys;
          from src.synthetic.bands import same_results as same;
          a = json.load(open('outputs/known_answer/claims12.json'));
          b = json.load(open('rerun.json'));
          sys.exit(0 if same(a, b) else 1)"
