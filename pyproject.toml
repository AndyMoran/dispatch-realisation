[project]
name = "dispatch-realisation"
version = "0.1.0"
description = "Public benchmark of GC0166 MDO/MDB declaration quality across GB battery BM units"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false   # src/ is run in place, not installed

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
