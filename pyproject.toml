[project]
name = "dispatch-realisation"
version = "0.1.0"
description = "Public benchmark of GC0166 MDO/MDB declaration quality across GB battery BM units"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.uv]
package = false   # src/ is run in place, not installed

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-W error"

# CODING.md §8. Files that produced frozen lock outputs are exempt and listed one by
# one, so that new files in the same folders are still checked.
[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
    "src/ingest/contract_coverage.py",
    "src/ingest/contract_sources.py",
    "src/ingest/gate_a1.py",
    "src/ingest/gate_a2.py",
    "src/ingest/lock_counts.py",
    "src/ingest/power_bound.py",
    "src/ingest/reference.py",
    "tests/test_contract_coverage.py",
    "tests/test_contract_sources.py",
    "tests/test_gate_a1.py",
    "tests/test_gate_a2.py",
    "tests/test_lock_counts.py",
    "tests/test_power_bound.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S307", "S102"]   # S307 eval, S102 exec

[tool.mypy]
strict = true
python_version = "3.12"
# Packages join this list as they are created (CODING.md §8).
files = [
    "src/model",
    "src/physics",
    "src/claims",
    "src/synthetic",
    "tests/test_model_types.py",
    "tests/test_claims_params.py",
    "tests/test_physics.py",
    "tests/test_claims12.py",
    "tests/test_scoring.py",
    "tests/test_synthetic_settings.py",
    "tests/test_frequency.py",
]

# Coverage floor for new packages (CODING.md §7); CI runs pytest with --cov.
[tool.coverage.run]
source = ["src/model", "src/physics", "src/claims", "src/synthetic"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
